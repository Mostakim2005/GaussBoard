name: Editor smoke
on:
  push:
    branches: ['main']
  pull_request:
    paths: ['src/**', 'test/**', 'scripts/**', 'electron/**', 'main.js', 'preload.js', 'package*.json', '.github/workflows/smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify i18n parity (7 locales)
        run: node scripts/i18n-check.js
      - name: Run pure-Node unit & security tests
        run: node --test test/*.test.mjs test/path-security.test.cjs test/storage-location.test.js test/android-*.test.js
      - run: npm run smoke:new
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GaussBoard-editor-smoke
          path: test/out/
          retention-days: 7
