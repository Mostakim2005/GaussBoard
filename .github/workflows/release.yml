# Builds GaussBoard (Electron / Chromium edition) for Windows across all
# deduplicated repository branches and publishes a GitHub Release with
# self-identifying binary filenames:
#   GaussBoard-Electron-Chromium-v<Version>-branch-<BranchSlug>-<ShortSHA>-Portable.exe
#   GaussBoard-Electron-Chromium-v<Version>-branch-<BranchSlug>-<ShortSHA>-Setup.exe
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover-branches:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      summary: ${{ steps.scan.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all remote branches and deduplicate by commit SHA
        id: scan
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --prune
          node - << 'EOF'
          const { execSync } = require('node:child_process');
          const fs = require('node:fs');

          const rawBranches = execSync("git for-each-ref --format='%(refname:short)|%(objectname)|%(objectname:short=7)' refs/remotes/origin/", { encoding: 'utf8' })
            .trim()
            .split('\n')
            .filter(Boolean);

          const bySha = new Map();
          for (const line of rawBranches) {
            const [ref, fullSha, shortSha] = line.split('|');
            if (!ref || ref === 'origin/HEAD' || ref === 'origin') continue;
            const branch = ref.replace(/^origin\//, '');

            let version = '0.0.0';
            try {
              const pkgRaw = execSync(`git show ${fullSha}:package.json`, { encoding: 'utf8' });
              version = JSON.parse(pkgRaw).version || '0.0.0';
            } catch {
              continue;
            }

            if (!bySha.has(fullSha)) {
              bySha.set(fullSha, {
                branches: [branch],
                full_sha: fullSha,
                short_sha: shortSha,
                version
              });
            } else {
              bySha.get(fullSha).branches.push(branch);
            }
          }

          const items = Array.from(bySha.values()).map((entry) => {
            entry.branches.sort((a, b) => (a === 'main' ? -1 : b === 'main' ? 1 : a.localeCompare(b)));
            const joinedBranch = entry.branches.join('+');
            const slug = entry.branches
              .map((b) => b.replace(/[^a-zA-Z0-9._-]+/g, '-').replace(/^-+|-+$/g, ''))
              .join('-and-');
            return {
              branch: joinedBranch,
              slug,
              is_primary: entry.branches.includes('main'),
              full_sha: entry.full_sha,
              short_sha: entry.short_sha,
              version: entry.version
            };
          });

          // Ensure at least one primary entry if 'main' was not present
          if (items.length > 0 && !items.some((i) => i.is_primary)) {
            items[0].is_primary = true;
          }

          const summary = items.map((i) => `${i.branch}@${i.short_sha}`).join(', ');
          console.log('Discovered deduplicated Electron/Chromium branches:', items);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(items)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `summary=${summary}\n`);
          EOF

  windows:
    needs: [discover-branches]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.discover-branches.outputs.matrix) }}
    steps:
      - name: Checkout branch (${{ matrix.target.branch }} @ ${{ matrix.target.short_sha }})
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target.full_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: node scripts/smoke.js --new-features

      - name: Build the installer and the portable build
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Rename binaries with Engine, Version, Branch, and Commit SHA
        shell: bash
        env:
          VERSION: ${{ matrix.target.version }}
          SLUG: ${{ matrix.target.slug }}
          SHA: ${{ matrix.target.short_sha }}
          IS_PRIMARY: ${{ matrix.target.is_primary }}
        run: |
          set -euo pipefail
          mkdir -p dist-release
          PREFIX="GaussBoard-Electron-Chromium-v${VERSION}-branch-${SLUG}-${SHA}"

          PORTABLE_SRC="dist/GaussBoard-v${VERSION}-Portable.exe"
          SETUP_SRC="dist/GaussBoard-Setup-${VERSION}.exe"
          BLOCKMAP_SRC="dist/GaussBoard-Setup-${VERSION}.exe.blockmap"

          test -f "$PORTABLE_SRC" || { echo "::error::Missing $PORTABLE_SRC"; exit 1; }
          test -f "$SETUP_SRC" || { echo "::error::Missing $SETUP_SRC"; exit 1; }

          cp "$PORTABLE_SRC" "dist-release/${PREFIX}-Portable.exe"
          cp "$SETUP_SRC" "dist-release/${PREFIX}-Setup.exe"

          if [ -f "$BLOCKMAP_SRC" ]; then
            cp "$BLOCKMAP_SRC" "dist-release/${PREFIX}-Setup.exe.blockmap"
          fi

          if [ "$IS_PRIMARY" = "true" ] && [ -f "dist/latest.yml" ]; then
            sed "s/GaussBoard-Setup-${VERSION}\.exe/${PREFIX}-Setup.exe/g" dist/latest.yml > dist-release/latest.yml
            cat dist-release/latest.yml
          fi

          ls -lh dist-release/

      - name: Upload build output as a workflow artifact (${{ matrix.target.slug }})
        uses: actions/upload-artifact@v4
        with:
          name: GaussBoard-Electron-Chromium-Windows-${{ matrix.target.slug }}-${{ matrix.target.short_sha }}
          path: dist-release/*
          if-no-files-found: error

      - name: Find the release notes for this version
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          F="release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$F" ]; then
            echo "path=$F" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach branch binaries to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          fail_on_unmatched_files: true
          name: GaussBoard [Electron-Chromium] ${{ github.ref_name }} (Branches: ${{ needs.discover-branches.outputs.summary }})
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
